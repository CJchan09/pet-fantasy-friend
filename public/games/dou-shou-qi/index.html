<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗兽棋 Dou Shou Qi</title>
<style>
  :root {
    /* 棋盘自适应高度，保证 9 行始终能塞进屏幕 */
    --cell: clamp(42px, min(11vw, calc((100vh - 196px) / 9)), 92px);
    --land: #e8dcc0;
    --river: #7fc4e0;
    --trap-top: #f4b6b6;
    --trap-bottom: #b6cef4;
    --den-top: #e07a7a;
    --den-bottom: #7a9be0;
    --grid-line: rgba(90, 70, 40, .35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 24px;
    background: radial-gradient(circle at top, #2f3b2a, #10140d);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f2ead8;
  }
  h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 4px;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .subtitle {
    margin: 0;
    font-size: 12px;
    color: #cfc4a3;
    opacity: .8;
  }
  #status {
    font-size: 17px;
    font-weight: 600;
    min-height: 24px;
    padding: 3px 18px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
  }
  #status.turn-red { color: #ff8a8a; }
  #status.turn-blue { color: #8ab4ff; }
  #status.win { color: #ffd76a; background: rgba(0,0,0,.5); }
  #status.thinking { color: #ffd76a; }

  #modeBar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #d8cca8;
  }
  #modeBar select {
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid #4a3a22;
    background: #1c1710;
    color: #f2ead8;
  }

  #boardFrame {
    padding: calc(var(--cell) * .22);
    border-radius: 10px;
    background-image: url('assets/frame.webp');
    background-size: 100% 100%;
    box-shadow: 0 12px 34px rgba(0,0,0,.65);
  }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    grid-template-rows: repeat(9, var(--cell));
    border: 3px solid rgba(60,42,20,.85);
    border-radius: 4px;
    /* 不能裁切：动物会探出格子，边缘那圈棋子否则会被切掉一块 */
    box-shadow: inset 0 0 24px rgba(0,0,0,.5);
    background: var(--land);
  }
  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--grid-line);
    /* 纹理上叠一层色调，保证陆地/河流一眼分得开
       （草地纹理本身偏灰白，不叠色的话中间那条"桥"会看起来像水） */
    background-image:
      linear-gradient(rgba(74,116,48,.42), rgba(74,116,48,.42)),
      url('assets/tex_grass.webp');
    background-size: 100% 100%, 300% 300%;
    cursor: default;
    user-select: none;
  }
  /* 用坐标错开纹理采样点，避免每格长得一模一样 */
  .cell.river {
    background-image:
      linear-gradient(rgba(26,116,180,.45), rgba(26,116,180,.45)),
      url('assets/tex_water.webp');
    background-size: 100% 100%, 260% 260%;
  }
  .cell.trap-top, .cell.trap-bottom {
    background-image:
      linear-gradient(rgba(120,72,24,.35), rgba(120,72,24,.35)),
      url('assets/tex_dirt.webp');
    background-size: 100% 100%, 280% 280%;
  }
  /* 捕兽夹图形，压在棋子下面 */
  .cell.trap-top::after, .cell.trap-bottom::after {
    content: "";
    position: absolute;
    inset: 3%;
    z-index: 1;
    background: url('assets/trap.svg') center / contain no-repeat;
    pointer-events: none;
    transform-origin: center;
  }
  /* 夹到人了：换成咬合造型 + 弹一下 */
  .cell.trap-snapped::after {
    background-image: url('assets/trap_snap.svg');
    animation: jawSnap .45s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes jawSnap {
    0%   { transform: scale(1.16) rotate(-6deg); }
    55%  { transform: scale(.92) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .cell.trap-top { box-shadow: inset 0 0 0 3px rgba(90,140,255,.55); }
  .cell.trap-bottom { box-shadow: inset 0 0 0 3px rgba(255,90,90,.55); }

  .cell.den-top, .cell.den-bottom {
    background-image: url('assets/den.webp');
    background-size: cover;
    background-position: center;
  }
  .cell.den-top { box-shadow: inset 0 0 0 4px rgba(70,120,255,.85), inset 0 0 18px rgba(0,0,0,.5); }
  .cell.den-bottom { box-shadow: inset 0 0 0 4px rgba(230,70,70,.85), inset 0 0 18px rgba(0,0,0,.5); }
  .cell.selectable::before {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: rgba(255, 235, 130, .55);
    box-shadow: 0 0 10px 2px rgba(255,235,130,.6);
    pointer-events: none;
  }
  .cell.capture-target::before {
    background: rgba(255, 80, 80, .5);
    box-shadow: 0 0 12px 3px rgba(255,80,80,.7);
  }

  /* 棋子 = 彩色圈线底盘 + 盖在上面的动物（动物不裁切，耳朵/鼻子会探出圈外） */
  .piece {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .piece:hover { transform: scale(1.07); }

  .piece .disc {
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    border: max(3px, calc(var(--cell) * .06)) solid;
    box-shadow: 0 3px 7px rgba(0,0,0,.5);
  }
  /* 队伍颜色主要靠圈线；盘面只用很淡的半透明底，
     让动物跟草地拉开一点对比，而不是压一块实心白盘 */
  .piece.red .disc {
    border-color: #d2352f;
    background: radial-gradient(circle at 38% 30%, rgba(255,252,250,.62), rgba(250,226,219,.34) 68%, rgba(238,198,187,.20));
  }
  .piece.blue .disc {
    border-color: #2f57bd;
    background: radial-gradient(circle at 38% 30%, rgba(250,253,255,.62), rgba(219,231,248,.34) 68%, rgba(195,212,238,.20));
  }

  /* 动物：原色不加滤镜。头的外接框≈底盘直径，
     于是两侧留得出圈线，而耳朵/鼻子这些长在方框四角的部分会穿出圆圈。 */
  .piece .art {
    position: absolute;
    inset: -2%;
    background-repeat: no-repeat;
    background-position: center 47%;
    background-size: contain;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.45));
    pointer-events: none;
  }

  /* 等级角标压在最上层，避免被动物盖住 */
  .piece .rank {
    position: absolute;
    left: 50%;
    bottom: 2%;
    transform: translateX(-50%);
    padding: 0 calc(var(--cell) * .07);
    border-radius: 999px;
    font-size: clamp(9px, calc(var(--cell) * .17), 16px);
    font-weight: 800;
    line-height: 1.45;
    color: #fff;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,.75);
    box-shadow: 0 1px 3px rgba(0,0,0,.5);
    pointer-events: none;
  }
  .piece.red  .rank { background: #c9302c; }
  .piece.blue .rank { background: #2f57bd; }

  /* 踩进对方陷阱：等级归零，视觉上也要看得出来 */
  .piece.trapped .art { filter: grayscale(.75) brightness(.82) drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .piece.trapped .disc { animation: trappedPulse 1.1s ease-in-out infinite; }
  .piece.trapped .rank { background: #6b6b6b; }
  @keyframes trappedPulse {
    0%, 100% { box-shadow: 0 3px 7px rgba(0,0,0,.5), 0 0 0 0 rgba(255,60,60,.7); }
    50%      { box-shadow: 0 3px 7px rgba(0,0,0,.5), 0 0 10px 5px rgba(255,60,60,.35); }
  }

  .piece.selected { transform: scale(1.09); }
  .piece.selected .disc {
    border-color: #ffe066;
    box-shadow: 0 0 14px 5px rgba(255,224,102,.8);
  }
  .piece.disabled { cursor: default; }

  #controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button {
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    background: #cba85a;
    color: #2a2110;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  button:hover { background: #e0bd6d; }

  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    max-width: 520px;
    justify-content: center;
    font-size: 12px;
    color: #d8cca8;
    opacity: .85;
  }
  #legend span { white-space: nowrap; }

  #winOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #winOverlay.show { display: flex; }
  #winBox {
    background: #1c1710;
    border: 2px solid #cba85a;
    border-radius: 12px;
    padding: 32px 48px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.7);
  }
  #winBox h2 { margin: 0 0 12px; font-size: 26px; color: #ffd76a; }
</style>
</head>
<body>

  <h1>斗兽棋</h1>
  <div class="subtitle">Dou Shou Qi · Jungle Chess</div>

  <div id="modeBar">
    <label for="modeSelect">对战模式：</label>
    <select id="modeSelect">
      <option value="none">双人对战（本地两人轮流）</option>
      <option value="ai-blue" selected>我执红，AI 执蓝</option>
      <option value="ai-red">我执蓝，AI 执红</option>
    </select>
  </div>

  <div id="status" class="turn-red">红方回合</div>

  <div id="boardFrame"><div id="board"></div></div>

  <div id="controls">
    <button id="restartBtn">重新开始</button>
  </div>

  <div id="legend">
    <span>象8 &gt; 狮7 &gt; 虎6 &gt; 豹5 &gt; 狼4 &gt; 狗3 &gt; 猫2 &gt; 鼠1</span>
    <span>鼠可下河吃象（需在陆地）；象不能吃鼠</span>
    <span>只有鼠能下河；狮/虎可跳河（鼠挡路则不能跳）</span>
    <span>踩进对方陷阱的棋子任何子都能吃</span>
  </div>

  <div id="winOverlay">
    <div id="winBox">
      <h2 id="winText">红方获胜！</h2>
      <button id="winRestartBtn">再来一局</button>
    </div>
  </div>

<script>
(function(){
  const ROWS = 9, COLS = 7;

  // art: 头像图路径。想换回全身图，把 head/ 去掉即可（assets/rat.png）
  const TYPES = {
    rat:      { rank: 1, name: '鼠', art: 'assets/head/rat.webp' },
    cat:      { rank: 2, name: '猫', art: 'assets/head/cat.webp' },
    dog:      { rank: 3, name: '狗', art: 'assets/head/dog.webp' },
    wolf:     { rank: 4, name: '狼', art: 'assets/head/wolf.webp' },
    leopard:  { rank: 5, name: '豹', art: 'assets/head/leopard.webp' },
    tiger:    { rank: 6, name: '虎', art: 'assets/head/tiger.webp' },
    lion:     { rank: 7, name: '狮', art: 'assets/head/lion.webp' },
    elephant: { rank: 8, name: '象', art: 'assets/head/elephant.webp' },
  };

  const DENS = { top: {row:0, col:3}, bottom: {row:8, col:3} };
  const TRAPS_TOP = [{row:0,col:2},{row:0,col:4},{row:1,col:3}];
  const TRAPS_BOTTOM = [{row:8,col:2},{row:8,col:4},{row:7,col:3}];

  function isRiver(r,c){
    return r>=3 && r<=5 && (c===1||c===2||c===4||c===5);
  }
  function cellInfo(r,c){
    if (r===DENS.top.row && c===DENS.top.col) return {kind:'den', owner:'blue'};
    if (r===DENS.bottom.row && c===DENS.bottom.col) return {kind:'den', owner:'red'};
    if (TRAPS_TOP.some(t=>t.row===r&&t.col===c)) return {kind:'trap', owner:'blue'};
    if (TRAPS_BOTTOM.some(t=>t.row===r&&t.col===c)) return {kind:'trap', owner:'red'};
    if (isRiver(r,c)) return {kind:'river'};
    return {kind:'land'};
  }

  function initialPieces(){
    const layout = [
      // blue (top), owner 'blue'
      ['lion',0,0,'blue'], ['tiger',0,6,'blue'],
      ['dog',1,1,'blue'], ['cat',1,5,'blue'],
      ['rat',2,0,'blue'], ['leopard',2,2,'blue'], ['wolf',2,4,'blue'], ['elephant',2,6,'blue'],
      // red (bottom), owner 'red'
      ['elephant',6,0,'red'], ['wolf',6,2,'red'], ['leopard',6,4,'red'], ['rat',6,6,'red'],
      ['cat',7,1,'red'], ['dog',7,5,'red'],
      ['tiger',8,0,'red'], ['lion',8,6,'red'],
    ];
    return layout.map(([type,row,col,owner],i)=>({
      id: 'p'+i, type, row, col, owner
    }));
  }

  let pieces, currentTurn, selectedId, gameOver, aiThinking;
  let aiOwner = 'blue'; // 'red' | 'blue' | null(no AI)
  const AI_DEPTH = 3;
  const PIECE_VALUE = { rat:3, cat:2, dog:3, wolf:4, leopard:5, tiger:6, lion:7, elephant:8 };

  function effectiveRank(piece){
    const info = cellInfo(piece.row, piece.col);
    if (info.kind==='trap' && info.owner !== piece.owner) return 0;
    return TYPES[piece.type].rank;
  }

  function pieceAt(r,c,piecesArr=pieces){
    return piecesArr.find(p => p.row===r && p.col===c) || null;
  }

  function canCapture(attacker, defender){
    if (attacker.type==='rat' && isRiver(attacker.row,attacker.col) && defender.type!=='rat') return false;
    if (defender.type==='rat' && isRiver(defender.row,defender.col) && attacker.type!=='rat') return false;
    if (attacker.type==='elephant' && defender.type==='rat') return false;
    if (attacker.type==='rat' && defender.type==='elephant') return true;
    return effectiveRank(attacker) >= effectiveRank(defender);
  }

  function inBounds(r,c){ return r>=0 && r<ROWS && c>=0 && c<COLS; }

  function legalMoves(piece, piecesArr=pieces){
    const moves = [];
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];

    for (const [dr,dc] of dirs){
      const nr = piece.row+dr, nc = piece.col+dc;
      if (!inBounds(nr,nc)) continue;
      const info = cellInfo(nr,nc);
      if (info.kind==='den' && info.owner===piece.owner) continue; // cannot enter own den
      if (info.kind==='river' && piece.type!=='rat') continue; // only rat swims
      const occ = pieceAt(nr,nc,piecesArr);
      if (occ){
        if (occ.owner===piece.owner) continue;
        if (info.kind==='den') continue; // dens are never occupied in practice
        if (canCapture(piece, occ)) moves.push({row:nr,col:nc,capture:true});
      } else {
        moves.push({row:nr,col:nc,capture:false});
      }
    }

    if (piece.type==='lion' || piece.type==='tiger'){
      for (const [dr,dc] of dirs){
        let r = piece.row+dr, c = piece.col+dc;
        if (!inBounds(r,c) || !isRiver(r,c)) continue;
        let blocked = false;
        while (inBounds(r,c) && isRiver(r,c)){
          const occ = pieceAt(r,c,piecesArr);
          if (occ && occ.type==='rat') blocked = true;
          r += dr; c += dc;
        }
        if (blocked) continue;
        if (!inBounds(r,c)) continue;
        const info = cellInfo(r,c);
        if (info.kind==='river') continue;
        if (info.kind==='den' && info.owner===piece.owner) continue;
        const occ = pieceAt(r,c,piecesArr);
        if (occ){
          if (occ.owner===piece.owner) continue;
          if (canCapture(piece, occ)) moves.push({row:r,col:c,capture:true});
        } else {
          moves.push({row:r,col:c,capture:false});
        }
      }
    }
    return moves;
  }

  // ---------- Simple AI (minimax + alpha-beta) ----------

  function allMovesForOwner(piecesArr, owner){
    const moves = [];
    for (const p of piecesArr.filter(p=>p.owner===owner)){
      for (const m of legalMoves(p, piecesArr)){
        moves.push({ pieceId: p.id, target: m });
      }
    }
    return moves;
  }

  function applyMoveSim(piecesArr, pieceId, target){
    const moving = piecesArr.find(p=>p.id===pieceId);
    const info = cellInfo(target.row, target.col);
    const isWin = info.kind==='den' && info.owner !== moving.owner;
    const newPieces = piecesArr
      .filter(p => p.id!==pieceId && !(p.row===target.row && p.col===target.col))
      .concat([{ ...moving, row: target.row, col: target.col }]);
    return { newPieces, isWin };
  }

  function evaluate(piecesArr, forOwner){
    let score = 0;
    for (const p of piecesArr){
      let v = PIECE_VALUE[p.type];
      const targetDen = p.owner==='red' ? DENS.top : DENS.bottom;
      const dist = Math.abs(p.row-targetDen.row) + Math.abs(p.col-targetDen.col);
      v += (14 - dist) * 0.05; // tiny nudge to advance toward enemy den
      score += (p.owner===forOwner ? v : -v);
    }
    return score;
  }

  function minimax(piecesArr, depth, alpha, beta, sideToMove, aiSide){
    const moves = allMovesForOwner(piecesArr, sideToMove);
    if (moves.length===0){
      return sideToMove===aiSide ? (-100000 - depth) : (100000 + depth);
    }
    if (depth===0) return evaluate(piecesArr, aiSide);

    const maximizing = sideToMove===aiSide;
    let best = maximizing ? -Infinity : Infinity;
    const nextSide = sideToMove==='red' ? 'blue' : 'red';

    for (const mv of moves){
      const { newPieces, isWin } = applyMoveSim(piecesArr, mv.pieceId, mv.target);
      const score = isWin
        ? (sideToMove===aiSide ? (100000 + depth) : (-100000 - depth))
        : minimax(newPieces, depth-1, alpha, beta, nextSide, aiSide);

      if (maximizing){
        if (score > best) best = score;
        if (best > alpha) alpha = best;
      } else {
        if (score < best) best = score;
        if (best < beta) beta = best;
      }
      if (beta <= alpha) break;
    }
    return best;
  }

  function findBestMove(piecesArr, aiSide, depth){
    const moves = allMovesForOwner(piecesArr, aiSide);
    if (moves.length===0) return null;
    const opponent = aiSide==='red' ? 'blue' : 'red';
    let bestScore = -Infinity;
    let bestMoves = [];
    let alpha = -Infinity, beta = Infinity;

    for (const mv of moves){
      const { newPieces, isWin } = applyMoveSim(piecesArr, mv.pieceId, mv.target);
      const score = isWin
        ? (100000 + depth)
        : minimax(newPieces, depth-1, alpha, beta, opponent, aiSide);

      if (score > bestScore){ bestScore = score; bestMoves = [mv]; }
      else if (score === bestScore){ bestMoves.push(mv); }
      if (bestScore > alpha) alpha = bestScore;
    }
    return bestMoves[Math.floor(Math.random()*bestMoves.length)];
  }

  function maybeScheduleAI(){
    if (gameOver || !aiOwner || currentTurn!==aiOwner) return;
    aiThinking = true;
    render();
    setTimeout(runAIMove, 250);
  }

  function runAIMove(){
    if (gameOver || !aiOwner || currentTurn!==aiOwner) { aiThinking=false; return; }
    const best = findBestMove(pieces, aiOwner, AI_DEPTH);
    aiThinking = false;
    if (!best){
      gameOver = true;
      render();
      showWin(aiOwner==='red' ? 'blue' : 'red');
      return;
    }
    const piece = pieces.find(p=>p.id===best.pieceId);
    doMove(piece, best.target);
  }

  // ---------- Rendering & interaction ----------

  function boardEl(){ return document.getElementById('board'); }
  function statusEl(){ return document.getElementById('status'); }

  function render(){
    const board = boardEl();
    board.innerHTML = '';
    const cellEls = {};

    for (let r=0;r<ROWS;r++){
      for (let c=0;c<COLS;c++){
        const info = cellInfo(r,c);
        const div = document.createElement('div');
        div.className = 'cell';
        if (info.kind==='river') div.classList.add('river');
        if (info.kind==='trap') div.classList.add(info.owner==='blue'?'trap-top':'trap-bottom');
        if (info.kind==='den') div.classList.add(info.owner==='blue'?'den-top':'den-bottom');
        div.dataset.row = r; div.dataset.col = c;
        if (info.kind!=='den'){
          // 错开纹理采样点，让相邻格子不会看起来一模一样
          div.style.backgroundPosition = ((c*37)%100) + '% ' + ((r*53)%100) + '%';
        }
        div.addEventListener('click', ()=>onCellClick(r,c));
        board.appendChild(div);
        cellEls[r+'_'+c] = div;
      }
    }

    let moves = [];
    const selected = pieces.find(p=>p.id===selectedId);
    if (selected) moves = legalMoves(selected);

    for (const m of moves){
      const el = cellEls[m.row+'_'+m.col];
      el.classList.add(m.capture ? 'capture-target' : 'selectable');
    }

    for (const p of pieces){
      const cellEl = cellEls[p.row+'_'+p.col];
      const pieceEl = document.createElement('div');
      pieceEl.className = 'piece ' + p.owner;
      if (p.id===selectedId) pieceEl.classList.add('selected');
      if (gameOver) pieceEl.classList.add('disabled');

      // 站在对方陷阱上 -> 等级归零
      const here = cellInfo(p.row, p.col);
      const trapped = here.kind==='trap' && here.owner !== p.owner;
      if (trapped){
        pieceEl.classList.add('trapped');
        cellEl.classList.add('trap-snapped');
      }

      const t = TYPES[p.type];
      pieceEl.innerHTML =
        `<div class="disc"></div>` +
        `<div class="art" style="background-image:url('${t.art}')"></div>` +
        `<div class="rank">${t.name}${trapped ? 0 : t.rank}</div>`;
      pieceEl.addEventListener('click', (e)=>{ e.stopPropagation(); onPieceClick(p); });
      cellEl.appendChild(pieceEl);

      // 动物会探出格子，抬高所在格层级，免得被相邻格的背景盖掉
      cellEl.style.zIndex = (p.id===selectedId) ? '6' : '3';
    }

    const st = statusEl();
    st.classList.remove('turn-red','turn-blue','win','thinking');
    if (!gameOver){
      const turnLabel = (currentTurn==='red' ? '红方' : '蓝方');
      const isAITurn = aiOwner===currentTurn;
      if (aiThinking){
        st.classList.add('thinking');
        st.textContent = `${turnLabel}（AI）思考中…`;
      } else {
        st.classList.add(currentTurn==='red'?'turn-red':'turn-blue');
        st.textContent = turnLabel + '回合' + (isAITurn ? '（AI）' : '');
      }
    }
  }

  function onPieceClick(piece){
    if (gameOver) return;
    if (aiOwner && currentTurn===aiOwner) return;
    if (piece.owner !== currentTurn){
      // clicking enemy piece while something selected -> try capture
      if (selectedId){
        const sel = pieces.find(p=>p.id===selectedId);
        const moves = legalMoves(sel);
        const target = moves.find(m=>m.row===piece.row && m.col===piece.col);
        if (target){ doMove(sel, target); return; }
      }
      return;
    }
    selectedId = (selectedId===piece.id) ? null : piece.id;
    render();
  }

  function onCellClick(r,c){
    if (gameOver || !selectedId) return;
    if (aiOwner && currentTurn===aiOwner) return;
    const sel = pieces.find(p=>p.id===selectedId);
    if (!sel) return;
    const moves = legalMoves(sel);
    const target = moves.find(m=>m.row===r && m.col===c);
    if (target) doMove(sel, target);
  }

  function doMove(piece, target){
    if (target.capture){
      const victim = pieceAt(target.row, target.col);
      pieces = pieces.filter(p=>p.id!==victim.id);
    }
    piece.row = target.row;
    piece.col = target.col;
    selectedId = null;

    const info = cellInfo(piece.row, piece.col);
    if (info.kind==='den' && info.owner !== piece.owner){
      gameOver = true;
      render();
      showWin(piece.owner);
      return;
    }

    currentTurn = currentTurn==='red' ? 'blue' : 'red';

    const oppPieces = pieces.filter(p=>p.owner===currentTurn);
    const hasMove = oppPieces.some(p=>legalMoves(p).length>0);
    if (!hasMove){
      gameOver = true;
      render();
      showWin(currentTurn==='red'?'blue':'red');
      return;
    }

    render();
    maybeScheduleAI();
  }

  function showWin(winner){
    const overlay = document.getElementById('winOverlay');
    const text = document.getElementById('winText');
    text.textContent = (winner==='red' ? '红方获胜！' : '蓝方获胜！');
    overlay.classList.add('show');
    try {
      window.parent.postMessage({
        source: 'dou-shou-qi',
        type: 'gameOver',
        winner: winner,
        aiOwner: aiOwner,
      }, window.location.origin);
    } catch (e) {}
  }

  function hideWin(){
    document.getElementById('winOverlay').classList.remove('show');
  }

  function restart(){
    pieces = initialPieces();
    currentTurn = 'red';
    selectedId = null;
    gameOver = false;
    aiThinking = false;
    hideWin();
    render();
    maybeScheduleAI();
  }

  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('winRestartBtn').addEventListener('click', restart);

  const modeSelect = document.getElementById('modeSelect');
  modeSelect.addEventListener('change', ()=>{
    const v = modeSelect.value;
    aiOwner = v==='ai-blue' ? 'blue' : v==='ai-red' ? 'red' : null;
    restart();
  });
  aiOwner = modeSelect.value==='ai-blue' ? 'blue' : modeSelect.value==='ai-red' ? 'red' : null;

  restart();
})();
</script>
</body>
</html>
